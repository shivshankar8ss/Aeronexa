services:
  # ── Backend Web Service ──
  - type: web
    name: aeronexa-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          
      - key: JWT_SECRET
        sync: false
      - key: AQICN_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CACHE_TTL
        value: "600"
      - key: CLIENT_URL
        sync: false          

  # ── Frontend Static Site
  - type: web
    name: aeronexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          
    routes:
      - type: rewrite
        source: /*
        destination: /index.html